name: Deploy Contracts to Sepolia Testnet

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target Network (sepolia / anvil)"
        required: true
        default: "sepolia"
      verify:
        description: "Verify on Etherscan (true / false)"
        required: true
        default: "true"

jobs:
  deploy:
    name: Deploy Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy and Broadcast
        run: |
          echo "Deploying to network: ${{ github.event.inputs.network }}"
          # When keys are configured in secrets:
          # cd contracts && forge script script/DeployAndSeed.s.sol --rpc-url $RPC_URL --broadcast
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
