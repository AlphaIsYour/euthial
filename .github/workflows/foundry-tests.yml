name: Foundry Tests & Coverage

on:
  push:
    branches: [main, dev-1, feat/test-coverage]
    paths:
      - 'contracts/**'
      - '.github/workflows/foundry-tests.yml'
  pull_request:
    branches: [main, dev-1, feat/test-coverage]
    paths:
      - 'contracts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Install dependencies
        run: cd contracts && forge remappings
      
      - name: Run unit tests
        run: cd contracts && forge test --match-path 'test/unit/*.t.sol' -v
      
      - name: Run fuzz tests
        run: cd contracts && forge test --match-path 'test/fuzz/*.t.sol' -v --fuzz-runs 1000
      
      - name: Run invariant tests
        run: cd contracts && forge test --match-path 'test/invariant/*.t.sol' -v
      
      - name: Run integration tests
        run: cd contracts && forge test --match-path 'test/integration/*.t.sol' -v
      
      - name: Generate LCOV coverage report
        run: cd contracts && (forge coverage --ir-minimum --report lcov --report-file coverage.lcov || forge coverage --report lcov --report-file coverage.lcov)
      
      - name: Generate JSON coverage report
        run: cd contracts && (forge coverage --report json > coverage.json 2>/dev/null || touch coverage.json)
        continue-on-error: true
      
      - name: Verify coverage threshold (≥95%)
        run: |
          cd contracts
          if [ -f coverage.lcov ]; then
            # Extract line coverage from LCOV report across all files
            LINE_COVERAGE=$(awk -F: '/^LH:/ {sum += $2} END {print sum}' coverage.lcov)
            TOTAL_LINES=$(awk -F: '/^LF:/ {sum += $2} END {print sum}' coverage.lcov)
            if [ -n "$LINE_COVERAGE" ] && [ -n "$TOTAL_LINES" ] && [ "$TOTAL_LINES" -gt 0 ]; then
              PERCENTAGE=$((LINE_COVERAGE * 100 / TOTAL_LINES))
              echo "Line Coverage: $PERCENTAGE% ($LINE_COVERAGE/$TOTAL_LINES lines)"
              if [ $PERCENTAGE -lt 95 ]; then
                echo "WARNING: Line coverage ($PERCENTAGE%) is below 95% threshold"
              else
                echo "SUCCESS: Coverage meets ≥95% requirement"
              fi
            else
              echo "WARNING: Could not extract coverage metrics from LCOV"
            fi
          fi
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: contracts/coverage.lcov
          flags: foundry
          fail_ci_if_error: false

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            contracts/coverage.lcov
            contracts/coverage.json
          if-no-files-found: ignore
          retention-days: 30
      
      - name: Check minimum coverage threshold
        run: |
          cd contracts
          # This is a placeholder for coverage threshold validation
          # Can be enhanced with tools like coverage-badges or lcov
          echo "Coverage report generated. Manual review recommended."
        continue-on-error: true
